      const r = await fetch(URL + '/functions/v1/asistente', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' },
        body: JSON.stringify({ modulo: modulo(), pregunta: q, contexto: ctx, pestanas: pestanas().map((p) => p.lb), por_voz: !!porVoz,
          acciones: acciones().map((x) => ({ nombre: x.nombre, descripcion: x.descripcion || '', parametros: x.parametros || { type: 'object', properties: {} } })) }) });
      const j = await r.json().catch(() => ({}));
      w.remove();
      if (!r.ok || !j.ok) throw new Error(j.error || ('Error ' + r.status));
      hist.push({ q, a: j.respuesta }); log('a', j);
      if (j.pestana && !j.accion) irA(j.pestana);
      if (porVoz || siempreVoz()) leer(j.respuesta);
      if (j.accion) await prepararAccion(j.accion, porVoz);
    } catch (e) { w.remove(); log('err', e.message || String(e)); }
    finally { ocupado = false; ta.focus(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', armar); else armar();
  return { abrir, cerrar, preguntar: (q) => { abrir(); panel.querySelector('textarea').value = q; enviar(false); },
    // para soporte: qué voz y ajustes usa Clodi en este equipo
    vozElegida: () => { const v = voz(); return { plataforma: plataforma(), voz: v ? v.name : null, idioma: v ? v.lang : null, ...AJUSTES[plataforma()] }; } };
})();

window.ADORNO_SSO = (function () {
  var KEY = 'adorno-auth', DEV = 'adorno-equipo-confiable', MOD = 'adorno-modulo-';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  // (22-oct-2026, migración a São Paulo) una sesión guardada del proyecto viejo no sirve en el nuevo: se descarta y se pide login
  try {
    var _s = JSON.parse(get(KEY) || 'null'), _t = _s && _s.access_token;
    // los tokens de sesión traen el proyecto en `iss` (https://<ref>.supabase.co/auth/v1); las claves del proyecto, en `ref`
    var _p = _t ? JSON.parse(atob(_t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) : null;
    if (_p && String(_p.iss || '').indexOf('jfwtiagteuwmyvblgwms') < 0 && _p.ref !== 'jfwtiagteuwmyvblgwms') del(KEY);
  } catch (e) {}
  return {
    KEY: KEY,
    // Al estrenar la clave compartida, adopta la sesión que este módulo ya
    // tenía guardada con su clave vieja: nadie se queda afuera por el cambio.
    migrar: function (keyVieja, modulo) {
      if (!keyVieja) return;
      var v = get(keyVieja);
      if (!v) return;
      // La sesión se copia una sola vez; la marca del módulo se pone siempre
      // que este módulo tuviera sesión propia — Documentos y Compras
      // compartían la clave por defecto y si no, al segundo le pediría login.
      if (!get(KEY)) set(KEY, v);
      var mail = '1';
      try { mail = (JSON.parse(v).user || {}).email || '1'; } catch (e) {}
      set(MOD + modulo, String(mail).toLowerCase());
    },
    confiable: function () { return get(DEV) === '1'; },
    confiar: function (si) { si ? set(DEV, '1') : del(DEV); },
    recordar: function (modulo, email) { set(MOD + modulo, String(email || '1').toLowerCase()); },
    entraDirecto: function (modulo, email) {
      if (this.confiable()) return true;
      var m = get(MOD + modulo);
      return !!m && (m === '1' || m === String(email || '').toLowerCase());
    },
    // Al cerrar sesión se olvidan los módulos, pero NO que el equipo es de
    // confianza: eso es una propiedad de la computadora, no de la sesión.
    olvidarModulos: function () {
      try {
        Object.keys(localStorage).filter(function (k) { return k.indexOf(MOD) === 0; }).forEach(del);
      } catch (e) {}
    }
  };
})();

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtFecha(s) {
  if (!s) return '';
  const [y, m, d] = s.substring(0, 10).split('-');
  return `${d}/${m}/${y}`;
}

function fmtMoneda(n) {
  if (n == null || isNaN(n)) return '';
  return '$ ' + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 2 });
}

function fmtPeriodo(s) {
  // Parsea YYYY-MM-DD directo sin usar new Date() para evitar el shift de
  // timezone Argentina (UTC-3 hace que '2026-05-01' se renderice como 'Abr 2026').
  if (!s) return '';
  const parts = s.substring(0, 7).split('-');
  if (parts.length < 2) return s;
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const mes = meses[parseInt(parts[1], 10) - 1] || parts[1];
  return `${mes} ${parts[0]}`;
}

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/**
 * Convierte el path almacenado en la DB (puede ser path Windows local o path
 * del VPS Linux) a una URL de SharePoint Web que abre el archivo en el browser.
 * Si el path es genérico ("OneDrive (formato anterior...)") o no matchea, devuelve null.
 */
function pathToSharepointUrl(path) {
  if (!path || typeof path !== 'string') return null;
  // (4-ago) Si ya es una URL web (el archivador nuevo guarda la URL de
  // SharePoint directa), usarla tal cual — antes caía a "legacy" por error.
  if (/^https?:\/\//i.test(path)) return path;
  let resto;
  if (path.startsWith(ONEDRIVE_WIN_PREFIX)) {
    resto = path.substring(ONEDRIVE_WIN_PREFIX.length);
  } else if (path.startsWith(VPS_PREFIX)) {
    resto = path.substring(VPS_PREFIX.length);
  } else {
    return null;  // formato no reconocido — no podemos linkear
  }
  // Normalizar separadores Win → Web
  resto = resto.replace(/\\/g, '/');
  // URL-encodear cada componente (espacios, acentos, etc.)
  const encoded = resto.split('/').map(encodeURIComponent).join('/');
  return SHAREPOINT_BASE + encoded;
}

async function cargarRecibos() {
  if (!puedeVerRecibos()) { _recibos = []; return; }
  // Trae las liquidaciones con info de la empleada.
  // NOTA: la columna del neto se llama `recibo_neto` (no total_neto).
  // (jul 2026) Solo recibos DEFINITIVOS: las liquidaciones en 'borrador' son
  // la proforma del mes en curso y no corresponde que se vean acá — antes
  // aparecían los 20 de julio sin firmar, sin que existiera todavía el recibo.
  const { data, error } = await sb.from('rrhh_liquidacion')
    .select('id, periodo, empleado_id, recibo_neto, pdf_firmado_at, pdf_url_firmado, pdf_url, local, estado, controlado, controlado_por, controlado_at, firma_rechazada_at, '
          + 'sac_recibo_neto, sac_pdf_firmado_at, sac_pdf_firmado_path, sac_controlado, sac_controlado_por, sac_controlado_at, sac_firma_rechazada_at')
    .eq('tipo', 'definitivo')  // (5-ago) definitivos, sin importar estado del workflow
    .gte('periodo', '2026-06-01')  // (27-ago, JP) recibos de sueldo desde JUNIO: mayo fue transición y no se controla acá
    .order('periodo', { ascending: false })
    .order('empleado_id');
  if (error) { console.error('recibos:', error); toast('Error cargando recibos: ' + error.message, 'error'); return; }
  // (27-ago) El SAC vive en la MISMA fila de la liquidación (columnas sac_*)
  // pero es un documento firmable aparte — Marisa no lo veía para controlar.
  // Cada SAC liquidado se expande como fila propia con esSac=true, mapeando
  // sus columnas a las genéricas que usa el render; el control usa tipo 'sac'.
  _recibos = [];
  (data || []).forEach(r => {
    _recibos.push(r);
    if (Number(r.sac_recibo_neto || 0) > 0) {
      _recibos.push({
        ...r, esSac: true,
        recibo_neto: r.sac_recibo_neto,
        pdf_firmado_at: r.sac_pdf_firmado_at,
        pdf_url_firmado: r.sac_pdf_firmado_path,
        firma_rechazada_at: r.sac_firma_rechazada_at,
        controlado: r.sac_controlado,
        controlado_por: r.sac_controlado_por,
        controlado_at: r.sac_controlado_at,
      });
    }
  });
  populateFiltros('rec', _recibos.map(r => r.periodo));
  renderRecibos();
}

async function cargarVacaciones() {
  const { data, error } = await sb.from('rrhh_vacaciones_movimientos')
    .select('id, empleado_id, fecha_desde, fecha_hasta, dias, estado, tipo_solicitud, documento_firmado_at, documento_firmado_path, documento_firmado_origen, fecha_solicitud, controlado, controlado_por, controlado_at, firma_rechazada_at')
    .gte('fecha_desde', RECIBOS_DESDE)  // solo sistema nuevo (desde mayo 2026)
    .order('fecha_desde', { ascending: false });
  if (error) { console.error('vacaciones:', error); return; }
  _vacaciones = data || [];
  populateFiltros('vac', _vacaciones.map(v => v.fecha_desde));
  renderVacaciones();
}

async function cargarTesoreria() {
  const { data, error } = await sb.from('tesoreria_movimientos')
    .select('id, codigo_seguimiento, fecha, importe, descripcion, categoria_id, cuenta_id, cargado_por, cargado_at, requiere_firma, firmado_at, firmado_origen, pdf_path, controlado, controlado_por, controlado_at, firma_rechazada_at')
    .eq('requiere_firma', true)  // solo egresos que requieren firma
    .gte('fecha', RECIBOS_DESDE)  // solo sistema nuevo (desde mayo 2026)
    .order('fecha', { ascending: false });
  if (error) { console.error('tesoreria:', error); return; }
  _tesoreria = data || [];
  populateFiltros('tes', _tesoreria.map(t => t.fecha));
  // Selector de cuentas
  const sel = document.getElementById('tes-cuenta');
  sel.innerHTML = '<option value="">Todas</option>' +
    _cuentas.filter(c => _tesoreria.some(t => t.cuenta_id === c.id))
      .map(c => `<option value="${c.id}">${escHtml(c.nombre)}</option>`).join('');
  renderTesoreria();
}

function populateFiltros(prefix, fechas) {
  // Año
  const anios = [...new Set(fechas.filter(f => f).map(f => f.substring(0, 4)))].sort().reverse();
  const selAnio = document.getElementById(prefix + '-anio');
  selAnio.innerHTML = '<option value="">Todos</option>' +
    anios.map(a => `<option value="${a}">${a}</option>`).join('');
  // Por default selecciono el año actual
  const anioActual = String(new Date().getFullYear());
  if (anios.includes(anioActual)) selAnio.value = anioActual;

  // Empleada (solo recibos y vacaciones)
  if (prefix === 'rec' || prefix === 'vac') {
    const selEmp = document.getElementById(prefix + '-empleado');
    selEmp.innerHTML = '<option value="">Todas</option>' +
      _empleados.map(e => `<option value="${e.id}">${escHtml(e.nombre_completo)}</option>`).join('');
  }
}

let _facturas = [];
let _depositos = [];
// (7-sep, JP) Facturas y Depósitos bancarios en apartados separados (los mismos
// respaldos que se eligen al cargar en Tesorería: recibo / factura / depósito).
async function cargarFacturas() {
  const { data, error } = await sb.from('tesoreria_movimientos')
    .select('id, fecha, importe, descripcion, categoria_id, cuenta_id, cargado_por, respaldo_tipo, factura_path, factura_enviada_at, controlado, controlado_por, controlado_at, observacion_control, observacion_control_por, observacion_control_at, archivo_item_id, archivo_carpeta, archivo_nombre, respaldo_rechazado_at, respaldo_rechazo_motivo')
    .in('respaldo_tipo', ['factura','deposito'])
    .gte('fecha', RECIBOS_DESDE)  // solo sistema nuevo (desde mayo 2026)
    .order('fecha', { ascending: false });
  if (error) { console.error('facturas:', error); return; }
  _facturas  = (data || []).filter(f => f.respaldo_tipo !== 'deposito');
  _depositos = (data || []).filter(f => f.respaldo_tipo === 'deposito');
  for (const [pre, lista] of [['fac', _facturas], ['dep', _depositos]]) {
    populateFiltros(pre, lista.map(f => f.fecha));
    const sel = document.getElementById(pre + '-cuenta');
    sel.innerHTML = '<option value="">Todas</option>' +
      _cuentas.filter(c => lista.some(f => f.cuenta_id === c.id))
        .map(c => `<option value="${c.id}">${escHtml(c.nombre)}</option>`).join('');
  }
  renderFacturas();
  renderDepositos();
}

const _docSort = { fac:{by:null,dir:1}, dep:{by:null,dir:1}, rec:{by:null,dir:1}, vac:{by:null,dir:1}, tes:{by:null,dir:1} };
const _docBusq = { fac:'', dep:'', rec:'', vac:'', tes:'' };
function docBuscar(tab, val, renderFn) {
  _docBusq[tab] = val;
  clearTimeout(window._docBuscarT);
  window._docBuscarT = setTimeout(() => {
    renderFn();
    const i = document.getElementById(tab + '-buscar');
    if (i && document.activeElement !== i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }, 300);
}
const _DOC_RENDERS = {};
function docOrdenar(tab, key) {
  const st = _docSort[tab];
  if (st.by === key) st.dir = -st.dir; else { st.by = key; st.dir = 1; }
  (_DOC_RENDERS[tab] || (() => {}))();
}
function docAplicar(tab, lista, getters) {
  const txt = (_docBusq[tab] || '').toLowerCase().trim();
  let out = lista;
  if (txt) out = out.filter(x => Object.values(getters).some(g => String(g(x) ?? '').toLowerCase().includes(txt)));
  const st = _docSort[tab];
  if (st.by && getters[st.by]) {
    out = out.slice().sort((a, b) => {
      const va = getters[st.by](a), vb = getters[st.by](b);
      const cmp = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va ?? '').localeCompare(String(vb ?? ''));
      return cmp * st.dir;
    });
  }
  return out;
}
function docTh(tab, key, label) {
  const st = _docSort[tab];
  const fl = st.by === key ? (st.dir === 1 ? ' ▲' : ' ▼') : '';
  return `<th onclick="docOrdenar('${tab}','${key}')" style="cursor:pointer;user-select:none;white-space:nowrap;" title="Ordenar por ${label}">${label}${fl}</th>`;
}
_DOC_RENDERS.fac = () => renderFacturas();
_DOC_RENDERS.dep = () => renderDepositos();
_DOC_RENDERS.rec = () => renderRecibos();
_DOC_RENDERS.vac = () => renderVacaciones();
_DOC_RENDERS.tes = () => renderTesoreria();

function renderFacturas() { renderRespaldo('fac'); }
function renderDepositos() { renderRespaldo('dep'); }
function renderRespaldo(pre) {
  const esDep = pre === 'dep';
  const anio = document.getElementById(pre + '-anio').value;
  const cuentaId = document.getElementById(pre + '-cuenta').value;
  const estado = document.getElementById(pre + '-estado').value;
  const etiqueta = esDep ? 'depósitos' : 'facturas';

  let filtrados = (esDep ? _depositos : _facturas).slice();
  if (anio) filtrados = filtrados.filter(f => f.fecha && f.fecha.startsWith(anio));
  if (cuentaId) filtrados = filtrados.filter(f => f.cuenta_id === parseInt(cuentaId));
  if (estado === 'controlado') filtrados = filtrados.filter(f => f.controlado);
  else if (estado === 'pendiente') filtrados = filtrados.filter(f => !f.controlado);
  else if (estado === 'observado') filtrados = filtrados.filter(f => !!f.observacion_control);

  const _ctFac = Object.fromEntries(_cuentas.map(c => [c.id, c]));
  const facGet = { fecha: f => f.fecha || '', caja: f => (_ctFac[f.cuenta_id] || {}).nombre || '',
    importe: f => Number(f.importe || 0), concepto: f => _categorias[f.categoria_id] || '', descripcion: f => f.descripcion || '',
    cargado: f => f.cargado_por || '', envio: f => f.factura_enviada_at || '', control: f => f.controlado ? 1 : 0 };
  filtrados = docAplicar(pre, filtrados, facGet);
  if (MODO_LOCAL) filtrados.sort((a, b) => (b.observacion_control ? 1 : 0) - (a.observacion_control ? 1 : 0));   // (v49) lo observado arriba

  _cntTab(esDep ? 'cnt-depositos' : 'cnt-facturas', (esDep ? _depositos : _facturas));
  const ctrl = filtrados.filter(f => f.controlado).length;
  document.getElementById(pre + '-stat').innerHTML =
    `<span title="${filtrados.length} ${etiqueta} · ${ctrl} controlad${esDep ? 'os' : 'as'} · ${filtrados.length - ctrl} pendientes"><strong>${filtrados.length}</strong> · ☑ <strong>${ctrl}</strong> · ⬜ <strong>${filtrados.length - ctrl}</strong></span>`;

  if (filtrados.length === 0) {
    document.getElementById(pre + '-body').innerHTML = empty(`No hay ${etiqueta} con esos filtros`);
    return;
  }

  const ctMap = Object.fromEntries(_cuentas.map(c => [c.id, c]));
  const rows = filtrados.map(f => {
    const ct = ctMap[f.cuenta_id] || {};
    // (7-sep) etapa del archivo en OneDrive (por ID, sobrevive renombres/mudanzas)
    // (13-oct, JP) etapa solo como ícono; el detalle aparece al pasar el mouse
    let enviada;
    if (f.respaldo_rechazado_at && !f.factura_path) {
      enviada = `<span class="ctl rojo" title="Archivo rechazado, esperando uno nuevo. Motivo: ${escHtml(f.respaldo_rechazo_motivo || '')}">${_ICO.deshacer}</span>`;
    } else if (f.archivo_item_id && /borrado/i.test(f.archivo_carpeta || '')) {
      // (26-oct, JP) el rechequeo del VPS no encontró más el archivo por ID: administración lo recreó con otro nombre
      // (el ID cambia) o lo borró. El link viejo da 404, así que no se ofrece; el VPS intenta re-encontrarlo cada hora.
      enviada = `<span class="ctl rojo" title="El archivo ya no está donde se guardó (lo renombraron o lo borraron del OneDrive). El link viejo daría error 404. El sistema lo busca de nuevo cada hora; si no aparece, pedir el archivo a administración.
${escHtml(f.archivo_nombre || '')}">${_ICO.alerta}</span>`;
    } else if (f.archivo_item_id) {
      const carp = (f.archivo_carpeta || '').split('/').filter(Boolean);
      const etapa = carp.length ? carp[carp.length - 1] : '?';
      const esEntrada = /SIN CONTABILIZAR/i.test(etapa);
      const esFinal = /FACTURAS|RETIROS/i.test(f.archivo_carpeta || '');
      const txt = esFinal ? 'Archivada (etapa final)' : (esEntrada ? 'Sin contabilizar: todavía la tiene que contabilizar el estudio' : 'En proceso');
      enviada = `<span class="ctl ${esFinal ? 'verde' : (esEntrada ? 'ambar' : 'azul')}" title="${escHtml(txt + ' — ' + etapa + '\n' + (f.archivo_carpeta || '') + ' / ' + (f.archivo_nombre || ''))}">${esFinal ? _ICO.archivo : _ICO.carpeta}</span>`;
    } else if (f.factura_path) {
      enviada = `<span class="ctl ambar" title="Por archivar: todavía no se subió al OneDrive (lo hace el VPS cada hora)">${_ICO.reloj}</span>`;
    } else {
      enviada = `<span class="ctl" title="Sin archivo">${_ICO.punto}</span>`;
    }
    const tieneArchivo = !!f.factura_path && !/borrado/i.test(f.archivo_carpeta || '');  // (26-oct) link muerto = sin link
    const obs = MODO_LOCAL
      ? (f.observacion_control ? `<span class="ctl ambar" title="${escHtml(f.observacion_control)}">${_ICO.alerta}</span>` : '')
      : f.observacion_control
      ? `<span class="ctl ambar" title="Observada por ${escHtml(f.observacion_control_por || '')}: ${escHtml(f.observacion_control)}">${_ICO.alerta}</span><span class="ctl rechazo" title="Levantar la observación" onclick="event.stopPropagation();docObservarMov(${f.id}, true)">${_ICO.ok}</span>`
      : `<span class="ctl rechazo" title="Observar: algo está mal (importe, concepto o el archivo adjunto) — le llega el aviso al local para corregirlo" onclick="event.stopPropagation();docObservarMov(${f.id}, false)">${_ICO.alerta}</span>`;
    const cuenta = String(ct.nombre || '?').replace(/^caja\s+/i, '');
    const concepto = String(_categorias[f.categoria_id] || '');
    const desc = String(f.descripcion || '');
    const quien = String(f.cargado_por || '').split('@')[0];
    return `<tr class="${tieneArchivo ? 'clickable' : 'dim'}${f.observacion_control ? ' obs' : ''}" ${tieneArchivo ? `onclick="window.open('${escHtml(f.factura_path)}', '_blank')"` : ''}>
      <td>${fmtFecha(f.fecha)}</td>
      <td>${escHtml(cuenta)}</td>
      <td style="color:${f.importe < 0 ? 'var(--red)' : 'var(--green)'};white-space:nowrap">${fmtMoneda(f.importe)}</td>
      <td class="desc-corta" style="max-width:150px" title="${escHtml(concepto)}">${escHtml(concepto)}</td>
      <td class="desc-corta" title="${escHtml(desc)}">${escHtml(desc)}${MODO_LOCAL && f.observacion_control ? `<div class="obs-txt">⚠ ${escHtml(f.observacion_control)}${f.observacion_control_por ? ' — ' + escHtml(String(f.observacion_control_por).split('@')[0]) : ''}</div>` : ''}</td>
      <td title="${escHtml(f.cargado_por || '')}">${escHtml(quien)}</td>
      <td style="text-align:center">${tieneArchivo ? `<a href="${escHtml(f.factura_path)}" target="_blank" class="doc-link" title="${esDep ? 'Abrir el comprobante' : 'Abrir la factura'}" onclick="event.stopPropagation()">${_ICO.clip}</a>` : `<span title="${/borrado/i.test(f.archivo_carpeta || '') ? 'El archivo ya no está en el OneDrive donde se guardó' : 'Sin archivo (rechazado o purgado por el circuito viejo)'}">—</span>`}</td>
      <td style="text-align:center">${enviada}</td>
      <td style="white-space:nowrap;">${chipControl('tesoreria', f.id, f.controlado, f.controlado_por, f.controlado_at)}${obs}</td>
    </tr>`;
  }).join('');

  document.getElementById(pre + '-body').innerHTML = `
    <table>
      <thead><tr>
        ${docTh(pre,'fecha','Fecha')}${docTh(pre,'caja','Caja')}${docTh(pre,'importe','Importe')}${docTh(pre,'concepto','Concepto')}${docTh(pre,'descripcion','Descripción')}
        ${docTh(pre,'cargado','Cargado por')}<th>${esDep ? 'Comprobante' : 'Factura'}</th>${docTh(pre,'envio','Etapa')}${docTh(pre,'control','Control')}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

  let filtrados = _recibos.slice();

  if (estado === 'firmado') filtrados = filtrados.filter(r => !!r.pdf_firmado_at);
  else if (estado === 'pendiente') filtrados = filtrados.filter(r => !r.pdf_firmado_at);

    local: r => (_empRec[r.empleado_id] || {}).local || '', periodo: r => r.periodo || '',

    else chip = `<span class="ctl" title="${escHtml(v.estado)}">${_ICO.punto}</span>`;
    const tipoIco = v.tipo_solicitud === 'toma' ? `<span class="ctl azul" title="Toma de vacaciones: días que se toma">${_ICO.sol}</span>`
      : v.tipo_solicitud === 'pago' ? `<span class="ctl verde" title="Pago de vacaciones: días no tomados que se pagan">${_ICO.billete}</span>`
      : v.tipo_solicitud === 'compensacion' ? `<span class="ctl violeta" title="Compensación: días a favor por francos o feriados trabajados">${_ICO.compensa}</span>`
      : `<span class="ctl" title="${escHtml(v.tipo_solicitud || '')}">${_ICO.punto}</span>`;

    const onclick = (firmado && url)
      ? `onclick="window.open('${url}', '_blank')"`
      : (firmado
          ? `onclick="toast('Path no convertible: ${escHtml(v.documento_firmado_path || '')}','error')"`
          : '');
    const cls = firmado && url ? 'clickable' : (firmado ? 'clickable' : 'dim');

    return `<tr class="${cls}" ${onclick}>
      <td>${escHtml(emp.nombre_completo || '?')}</td>
      <td>${escHtml(emp.local || '')}</td>
      <td>${fmtFecha(v.fecha_desde)} → ${fmtFecha(v.fecha_hasta)}</td>
      <td>${v.dias || '—'}</td>
      <td style="text-align:center">${tipoIco}</td>
      <td style="text-align:center;white-space:nowrap">${chip}</td>
      <td>${firmado ? fmtFecha(v.documento_firmado_at) : '—'}</td>
      <td>${chipControl('vacaciones', v.id, v.controlado, v.controlado_por, v.controlado_at)}</td>
    </tr>`;
  }).join('');

  document.getElementById('vac-body').innerHTML = `
    <table>
      <thead><tr>
        ${docTh('vac','empleada','Empleada')}${docTh('vac','local','Local')}${docTh('vac','periodo','Período')}${docTh('vac','dias','Días')}
        ${docTh('vac','tipo','Tipo')}${docTh('vac','estado','Estado')}${docTh('vac','firma','Fecha firma')}${docTh('vac','control','Control')}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ═══════════════════════════════════════════════════════════════════════
// Render: Tesorería
// ═══════════════════════════════════════════════════════════════════════
function renderTesoreria() {
  const anio = document.getElementById('tes-anio').value;
  const cuentaId = document.getElementById('tes-cuenta').value;
  const estado = document.getElementById('tes-estado').value;

  let filtrados = _tesoreria.slice();
  if (anio) filtrados = filtrados.filter(t => t.fecha && t.fecha.startsWith(anio));
  if (cuentaId) filtrados = filtrados.filter(t => t.cuenta_id === parseInt(cuentaId));
  if (estado === 'firmado') filtrados = filtrados.filter(t => !!t.firmado_at);
  else if (estado === 'pendiente') filtrados = filtrados.filter(t => !t.firmado_at);

  const _ctTes = Object.fromEntries(_cuentas.map(c => [c.id, c]));
  const tesGet = { fecha: t => t.fecha || '', codigo: t => t.codigo_seguimiento || '',
    cuenta: t => (_ctTes[t.cuenta_id] || {}).nombre || '', importe: t => Number(t.importe || 0),
    concepto: t => _categorias[t.categoria_id] || '',
    descripcion: t => t.descripcion || '', cargado: t => t.cargado_por || '',
    estado: t => t.firmado_at ? 1 : 0, firma: t => t.firmado_at || '', control: t => t.controlado ? 1 : 0 };
  filtrados = docAplicar('tes', filtrados, tesGet);

  _cntTab('cnt-tesoreria', _tesoreria);
  const firmados = filtrados.filter(t => t.firmado_at).length;
  document.getElementById('tes-stat').innerHTML =
    `<span title="${filtrados.length} movimientos · ${firmados} firmados · ${filtrados.length - firmados} pendientes de firma"><strong>${filtrados.length}</strong> · ✅ <strong>${firmados}</strong> · ⏳ <strong>${filtrados.length - firmados}</strong></span>`;

  if (filtrados.length === 0) {
    document.getElementById('tes-body').innerHTML = empty('No hay movimientos con esos filtros');
    return;
  }

  const ctMap = Object.fromEntries(_cuentas.map(c => [c.id, c]));
  const rows = filtrados.map(t => {
    const ct = ctMap[t.cuenta_id] || {};
    const url = pathToSharepointUrl(t.pdf_path);
    const firmado = !!t.firmado_at;
    // (13-oct, JP) estado solo ícono con texto en hover
    const chip = firmado
      ? `<span class="ctl ok" title="Firmado y guardado — click en la fila para abrir el PDF">${_ICO.ok}</span>${MODO_LOCAL ? '' : `<span class="ctl rechazo" title="Rechazar esta firma y pedir que la rehagan" onclick="event.stopPropagation();docRechazarFirma('tesoreria', ${t.id})">${_ICO.deshacer}</span>`}`
      : (t.firma_rechazada_at
          ? `<span class="ctl rojo" title="Firma rechazada el ${fmtFecha(t.firma_rechazada_at)} — el PDF viejo se borró del OneDrive y del archivero. Cuando llegue el escaneo corregido se toma solo, aunque se llame igual.">${_ICO.deshacer}</span>`
          : `<span class="ctl ambar" title="Sin firma: todavía no llegó el recibo firmado">${_ICO.reloj}</span>`);
    const onclick = (firmado && url)
      ? `onclick="window.open('${url}', '_blank')"`
      : (firmado
          ? `onclick="toast('Path no convertible: ${escHtml(t.pdf_path || '')}','error')"`
          : '');
    const cls = firmado && url ? 'clickable' : (firmado ? 'clickable' : 'dim');
    // (13-oct, JP) columnas compactas: nº de MOV, cuenta sin "Caja", descripción en un renglón, usuario hasta la @
    const nroMov = String(t.codigo_seguimiento || '').replace(/^MOV-0*/i, '') || String(t.id);
    const cuenta = String(ct.nombre || '?').replace(/^caja\s+/i, '');
    const desc = String(t.descripcion || '');
    const quien = String(t.cargado_por || '').split('@')[0];
    return `<tr class="${cls}" ${onclick}>
      <td>${fmtFecha(t.fecha)}</td>
      <td title="${escHtml(t.codigo_seguimiento || '')}">${escHtml(nroMov)}</td>
      <td>${escHtml(cuenta)}</td>
      <td style="color:${t.importe < 0 ? 'var(--red)' : 'var(--green)'};white-space:nowrap">${fmtMoneda(t.importe)}</td>
      <td>${escHtml(_categorias[t.categoria_id] || '')}</td>
      <td class="desc-corta" title="${escHtml(desc)}">${escHtml(desc)}</td>
      <td title="${escHtml(t.cargado_por || '')}">${escHtml(quien)}</td>
      <td style="text-align:center;white-space:nowrap">${chip}</td>
      <td>${firmado ? fmtFecha(t.firmado_at) : '—'}</td>
      <td>${chipControl('tesoreria', t.id, t.controlado, t.controlado_por, t.controlado_at)}</td>
    </tr>`;
  }).join('');

  document.getElementById('tes-body').innerHTML = `
    <table>
      <thead><tr>
        ${docTh('tes','fecha','Fecha')}${docTh('tes','codigo','MOV')}${docTh('tes','cuenta','Cuenta')}${docTh('tes','importe','Importe')}
        ${docTh('tes','concepto','Concepto')}${docTh('tes','descripcion','Descripción')}${docTh('tes','cargado','Cargado por')}${docTh('tes','estado','Estado')}${docTh('tes','firma','Fecha firma')}${docTh('tes','control','Control')}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ═══════════════════════════════════════════════════════════════════════
// Helpers UI
// ═══════════════════════════════════════════════════════════════════════
// (5-ago) Rechazar una firma: vuelve a "sin firmar", limpia el control y
// le llega push a la encargada del local para que la rehagan.
// (5-ago) Observar un movimiento con factura mal cargado (importe distinto,
// PDF equivocado): push al local para que lo corrija o lo borre y recargue.
// (7-sep) Rechazar el archivo de una factura/depósito: foto equivocada. Se
// borra del OneDrive por ID (papelera) y el local vuelve a adjuntar.
async function docRechazarRespaldo(id, motivoDado) {
  const motivo = motivoDado || prompt('¿Por qué se rechaza el archivo?\n(ej: "la foto no es la factura", "está ilegible")\nSe borra del OneDrive y el local tiene que volver a adjuntarlo.');
  if (!motivo) return;
  let { data, error } = await sb.rpc('doc_rechazar_respaldo', { p_id: id, p_motivo: motivo, p_confirmar_movido: false });
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  if (data && data.necesita_confirmacion) {
    if (!confirm(`⚠ ${data.msg}\n\nArchivo: ${data.nombre || ''}\n\n¿Borrarlo IGUAL y pedir uno nuevo al local?`)) return;
    ({ data, error } = await sb.rpc('doc_rechazar_respaldo', { p_id: id, p_motivo: motivo, p_confirmar_movido: true }));
    if (error) { toast('Error: ' + error.message, 'error'); return; }
  }
  toast('🗑 Archivo rechazado — se borra del OneDrive en unos minutos y se avisó a ' + ((data && data.local) || 'el local'));
  cargarTodo();
}

async function docObservarMov(id, levantar) {
  let motivo = '';
  if (levantar) {
    if (!confirm('¿Levantar la observación de este movimiento?')) return;
  } else {
    motivo = prompt('¿Qué está mal en este movimiento?\n(ej: "el importe no coincide con la factura", "el PDF adjunto es de otra cosa")\nEl aviso le llega a la encargada del local.');
    if (motivo === null) return;
    if (!motivo.trim()) { toast('Escribí el motivo', 'error'); return; }
  }
  const { data, error } = await sb.rpc('doc_observar_mov', { p_id: id, p_motivo: motivo });
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast(levantar ? '✓ Observación levantada' : '⚠ Observado — se avisó al local para que lo corrija');
  // (13-oct, JP) si el problema es el archivo (en blanco, foto equivocada), ofrecer borrarlo también
  if (!levantar) {
    const mov = [..._facturas, ..._depositos].find(x => x.id === id);
    if (mov && mov.factura_path && confirm('¿El problema es el ARCHIVO adjunto (en blanco, ilegible, de otra cosa)?' + String.fromCharCode(10,10) + 'Aceptar = se borra del OneDrive y el local tiene que volver a adjuntarlo.' + String.fromCharCode(10) + 'Cancelar = el archivo queda, solo se avisa la observación.')) {
      await docRechazarRespaldo(id, motivo);
      return;
    }
  }
  cargarTodo();
}

// Chip de "sin firma": si el documento fue RECHAZADO lo dice.
// Antes el rechazo de un recibo o de unas vacaciones volvía a verse como un
// "⏳ Sin firma" cualquiera y no quedaba rastro en pantalla de que alguien lo
// había rechazado — parte de por qué el problema tardó en verse.
function chipSinFirma(rechazadaAt) {
  if (!rechazadaAt) return `<span class="chip amber">⏳ Sin firma</span>`;
  return `<span class="chip" style="background:#fee2e2;color:#991b1b;" title="Rechazada el ${fmtFecha(rechazadaAt)} — el PDF viejo se borró del OneDrive y del archivero. Cuando llegue el escaneo corregido se toma solo, aunque se llame igual.">↩ Rechazada</span>`;
}

async function docRechazarFirma(tipo, id) {
  const motivo = prompt('¿Por qué se rechaza esta firma?\n(el motivo le llega a la encargada del local para rehacerla)');
  if (motivo === null) return;
  if (!confirm('El documento vuelve a "Sin firma" y se le avisa al local. ¿Confirmás?')) return;
  const { data, error } = await sb.rpc('doc_rechazar_firma', { p_tipo: tipo, p_id: id, p_motivo: motivo || '' });
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('✍ Firma rechazada — se avisó a ' + ((data && data.local) || 'el local') + ' para rehacerla' + ((data && data.borrar_path) ? '. El PDF se borra del OneDrive en unos minutos.' : ''));
  cargarTodo();
}

function empty(msg) {
  return `<div class="empty"><div class="emoji">📭</div>${escHtml(msg)}</div>`;
}

function toggleTabsMenu(ev) { ev.stopPropagation(); document.getElementById('tabs').classList.toggle('open'); }
document.addEventListener('click', () => document.getElementById('tabs')?.classList.remove('open'));
function switchTab(name) {
  document.getElementById('tabs').classList.remove('open');
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('content-' + name).classList.add('active');
}
</script>

<script>
// ⇪ Aviso de Bloq Mayús en campos de contraseña (agregado 14-ago-2026)
(function () {
  function toggleAviso(input, on) {
    var el = input.nextElementSibling;
    var esAviso = el && el.classList && el.classList.contains('caps-aviso');
    if (on && !esAviso) {
      el = document.createElement('div');
      el.className = 'caps-aviso';
      el.textContent = '\u21ea May\u00fasculas activadas';
      el.style.cssText = 'color:#b45309;font-size:12px;font-weight:600;margin-top:4px;';
      input.insertAdjacentElement('afterend', el);
    } else if (!on && esAviso) {
      el.remove();
    }
  }
  function handler(e) {
    var t = e.target;
    if (t && t.type === 'password' && typeof e.getModifierState === 'function') {
      toggleAviso(t, e.getModifierState('CapsLock'));
    }
  }
  document.addEventListener('keydown', handler, true);
  document.addEventListener('keyup', handler, true);
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t && t.type === 'password') toggleAviso(t, false);
  }, true);
})();
</script>
